
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKE Meter</title>

<!-- Configuración de la aplicación PKE -->
<link rel="manifest" href="/pke-meter/manifest.json">
<meta name="theme-color" content="#030906">
<link rel="apple-touch-icon" href="/pke-meter/pke-icon-192.png">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #030906;
  color: #65ffad;
  font-family: Consolas, monospace;
  display: flex;
  justify-content: center;
  align-items: center;
}

.pke-panel {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 5px;
  padding: 10px 0;
}

.pke-controls {
  text-align: center;
  z-index: 2;
}

.led-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.led-column span {
  display: block;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #123d2b;
  border: 1px solid #267d55;
  box-shadow: 0 0 4px #176d50;
  transition: background .15s, box-shadow .15s;
}

.led-column.left span:nth-child(1) { transform: translateX(20px); }
.led-column.left span:nth-child(2) { transform: translateX(10px); }
.led-column.left span:nth-child(3) { transform: translateX(0); }
.led-column.left span:nth-child(4) { transform: translateX(-10px); }
.led-column.left span:nth-child(5) { transform: translateX(-20px); }

.led-column.right span:nth-child(1) { transform: translateX(-20px); }
.led-column.right span:nth-child(2) { transform: translateX(-10px); }
.led-column.right span:nth-child(3) { transform: translateX(0); }
.led-column.right span:nth-child(4) { transform: translateX(10px); }
.led-column.right span:nth-child(5) { transform: translateX(20px); }

.led-column span.active {
  background: #39ff91;
  border-color: #aaffd0;
  box-shadow: 0 0 7px #39ff91, 0 0 14px #19ff83;
}

.led-column span.peak {
  background: #ffffff;
  border-color: #ffffff;
  box-shadow: 0 0 5px #ffffff;
  opacity: .45;
}

.led-column span.peak.peak-on {
  opacity: 1;
  box-shadow: 0 0 15px #ffffff, 0 0 25px #39ff91;
}

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  background:
    radial-gradient(ellipse at center, #09251a 0%, #030906 75%);
}

.header {
  width: 100%;
  text-align: center;
  border-bottom: 1px solid #1d8155;
  padding-bottom: 14px;
  letter-spacing: 4px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
  text-shadow: 0 0 12px #37ff91;
}

.header p {
  font-size: 10px;
  letter-spacing: 3px;
  color: #43b8b7;
}

.status {
  display: none;
}

.radar {
  width: min(82vw, 350px);
  aspect-ratio: 1;
  border: 2px solid #36eaa0;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  background:
    repeating-radial-gradient(
      circle,
      transparent 0 18%,
      #14563e 18.5% 19%,
      transparent 19.5% 29%
    ),
    linear-gradient(90deg, transparent 49.7%, #176d50 50%, transparent 50.3%),
    linear-gradient(transparent 49.7%, #176d50 50%, transparent 50.3%),
    #04140e;
  box-shadow:
    0 0 12px #1cff96,
    inset 0 0 25px #13794d;
}

.radar::before {
  opacity: 0;
  transition: opacity .3s;
  content: "";
  position: absolute;
  inset: 0;
  background: conic-gradient(
  from 0deg,
  transparent 0deg,
  transparent 300deg,
  #0cff8730 330deg,
  #48ffb6a0 350deg,
  #48ffb6a0 355deg,
  transparent 360deg
);
  border-radius: 50%;
  transform: rotate(var(--sweep-angle, 0deg));
}
.radar.scanning::before {
  opacity: 1;
}

.radar::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b6ffe0;
  box-shadow: 0 0 12px #39ffa0;
  transform: translate(-50%, -50%);
}

.axis {
  position: absolute;
  z-index: 1;
  color: #43b8b7;
  font-size: 10px;
}

.north { top: 8px; left: 50%; transform: translateX(-50%); }
.east { right: 8px; top: 50%; transform: translateY(-50%); }
.south { bottom: 8px; left: 50%; transform: translateX(-50%); }
.west { left: 8px; top: 50%; transform: translateY(-50%); }



.target {
  position: absolute;
  top: var(--target-y, 28%);
  left: var(--target-x, 66%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #69fff6;
  box-shadow: 0 0 20px 8px #14f4dc80;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.5);
  transition:
    top 0.45s ease-in-out,
    left 0.45s ease-in-out,
    opacity 0.3s,
    transform 0.2s,
    box-shadow 0.2s;
  z-index: 2;
  pointer-events: none;
}

.target.trace {
  opacity: 0;
}

.target.detected {
  opacity: 0;
}

.target.flash {
  opacity: 1;
  transform: translate(-50%, -50%) scale(0.80);
  background: #dffff5;
  box-shadow: 0 0 18px 8px #14f4dc;
}




.metrics {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.metric {
  border: 1px solid #237b54;
  background: #06170f;
  padding: 14px 8px;
  text-align: center;
}

.metric span {
  display: block;
  font-size: 10px;
  color: #55bba0;
  letter-spacing: 2px;
}

.metric strong {
  display: block;
  margin-top: 8px;
  font-size: 25px;
  text-shadow: 0 0 8px #31ff99;
}

.footer {
  margin-top: auto;
  padding-top: 10px;
  color: #317d60;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
}

@keyframes sweep {
  to { transform: rotate(360deg); }
}

@keyframes targetPulse {
  50% { transform: scale(.85); }
}

@keyframes pulse {
  50% { opacity: .45; }
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <h1>P K E</h1>
    <p>PARANORMAL DETECTION SYSTEM</p>
  </header>

  <div class="status" id="status">● SCANNING AREA</div>

<div class="pke-panel">

  <div class="led-column left" id="ledLeft">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="pke-controls">
    <div style="text-align:center;font-size:12px;line-height:1.8">
      HEADING: <strong id="heading">---</strong>°
      <br>
      TARGET: <strong id="targetHeading">---</strong>°
      <br>
      <button id="startCompass" style="padding:10px;background:#09251a;color:#65ffad;border:1px solid #36eaa0;font-family:Consolas,monospace">
        ACTIVATE PKE
      </button>
      <button id="setTarget" style="padding:10px;background:#09251a;color:#65ffad;border:1px solid #36eaa0;font-family:Consolas,monospace">
        SET DIRECTION
      </button>
    </div>
  </div>

  <div class="led-column right" id="ledRight">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>

  <div class="radar">
    <span class="axis north">N</span>
    <span class="axis east">E</span>
    <span class="axis south">S</span>
    <span class="axis west">W</span>
    <span class="target"></span>
  </div>

  <div class="metrics">
    <div class="metric">
      <span>PKE LEVEL</span>
      <strong id="pke">000</strong>
    </div>
    <div class="metric">
      <span>ENTITY SIGNAL</span>
      <strong id="signal">SEARCHING</strong>
    </div>
    <div class="metric">
      <span>SCAN MODE</span>
      <strong>AUTO</strong>
    </div>
    <div class="metric">
     <span>STATUS</span> 
     <strong id="pkeStatus">OFF</strong>
    </div>
  </div>

  <div class="footer">
    FIELD UNIT // PKE-MK IV<br>
    GHOSTBUSTERS RESEARCH DIVISION
  </div>

</div>

<audio id="pkeAudio" src="pke funcionamiento.mp3" loop preload="auto"></audio>

<script>
const pke = document.getElementById("pke");
const signal = document.getElementById("signal");
const status = document.getElementById("status");
const target = document.querySelector(".target");
const headingDisplay = document.getElementById("heading");
const targetDisplay = document.getElementById("targetHeading");
const startButton = document.getElementById("startCompass");
const targetButton = document.getElementById("setTarget");
const pkeAudio = document.getElementById("pkeAudio");
const detectedBeep = new Audio("detected-beep.mp3");

detectedBeep.loop = true;
detectedBeep.volume = 0.6;

const pkeStatus = document.getElementById("pkeStatus");

let currentHeading = null;
let searchOriginHeading = null;
let searchStarted = false;
let targetHeading = null;
let compassActive = false;
let sweepAngle = 0;
let lastSweepTime = 0;
let radarActive = false;
let sweepStartTime = null;
let targetX = 66;
let targetY = 28;
let targetAngle = 0;
let targetDistance = 0;
let signalActive = false;
let wasDetected = false;
let vibrationTimer = null;
let lastFlashTime = 0;
let targetMoving = false;
let targetMoveTime = 0;
let targetWaitingForSweep = true;

function normalize(deg) {
  return ((deg % 360) + 360) % 360;
}

function angleDifference(a, b) {
  return Math.abs(((a - b + 540) % 360) - 180);
}

function updateLEDs(difference) {
  const leftLEDs = document.querySelectorAll("#ledLeft span");
  const rightLEDs = document.querySelectorAll("#ledRight span");

  let level = 0;

  if (difference <= 45) level = 1;
  if (difference <= 30) level = 2;
  if (difference <= 20) level = 3;
  if (difference <= 10) level = 4;
  if (difference <= 4) level = 5;

  [leftLEDs, rightLEDs].forEach(ledGroup => {
    ledGroup.forEach((led, index) => {
      led.classList.remove("active", "peak");

      // Encendido desde abajo hacia arriba.
      if (index >= 5 - level) {
        led.classList.add("active");
      }

      // Último LED: parpadeo blanco.
      if (difference <= 4 && index === 0) {
        led.classList.remove("active");
        led.classList.add("peak");
      }
    });
  });
}

function stopDetectionSounds() {
  detectedBeep.pause();
  detectedBeep.currentTime = 0;
}


function updateDetection() {
  if (currentHeading === null || targetHeading === null) return;

  const difference = angleDifference(currentHeading, targetHeading);
  signalActive = difference <= 6;

  updateLEDs(difference);

  // El sonido solo se reproduce al entrar en DETECTED.
if (difference <= 4) {
  if (detectedBeep.paused) {
    detectedBeep.currentTime = 0;
    detectedBeep.play().catch(error =>
      console.error("Error en sonido DETECTED:", error)
    );
  }
} else {
  stopDetectionSounds();
}

  // DETECTED: LED y vibración.
  if (difference <= 4) {
    if (!wasDetected) {
      wasDetected = true;

      const peakLEDs = document.querySelectorAll(
        "#ledLeft span:first-child, #ledRight span:first-child"
      );

      let peakOn = true;

      peakLEDs.forEach(led => led.classList.add("peak-on"));

      if ("vibrate" in navigator) {
        navigator.vibrate(60);
      }

      vibrationTimer = setInterval(() => {
        peakOn = !peakOn;

        peakLEDs.forEach(led => {
          led.classList.toggle("peak-on", peakOn);
        });

        if ("vibrate" in navigator) {
          navigator.vibrate(peakOn ? 60 : 0);
        }
      }, 120);
    }
  } else {
    if (wasDetected) {
      clearInterval(vibrationTimer);
      vibrationTimer = null;

      document.querySelectorAll(".peak-on").forEach(led => {
        led.classList.remove("peak-on");
      });

      if ("vibrate" in navigator) {
        navigator.vibrate(0);
      }
    }

    wasDetected = false;
  }

  headingDisplay.textContent = Math.round(currentHeading);

  // El punto solo destella cuando el barrido lo alcanza.
  target.classList.remove("trace", "detected");

  if (difference <= 4) {
    status.textContent = "● PKE SIGNAL DETECTED";
    signal.textContent = "DETECTED";
    pke.textContent = "100";
    target.classList.add("detected");
  } else if (difference <= 6) {
    status.textContent = "● ENTITY TRACE";
    signal.textContent = "TRACE";
    pke.textContent = String(Math.round(80 - difference)).padStart(3, "0");
    target.classList.add("trace");
  } else {
    status.textContent = "● SCANNING AREA";
    signal.textContent = "LOW";
    pke.textContent = String(Math.max(0, Math.round(30 - difference / 3))).padStart(3, "0");
  }
}
  function onOrientation(event) {
  let heading = null;
 
  // Chrome en Android puede exponer el rumbo de brújula así.
  if (typeof event.webkitCompassHeading === "number") {
    heading = event.webkitCompassHeading;
  } else if (event.absolute && typeof event.alpha === "number") {
    heading = 360 - event.alpha;
  }

  if (heading === null || !Number.isFinite(heading)) return;

  currentHeading = normalize(heading);

  if (typeof event.beta === "number") {
  pkeStatus.textContent =
    "BETA: " + Math.round(event.beta) + "°";
}

if (targetHeading !== null && !searchStarted) {
  if (angleDifference(currentHeading, searchOriginHeading) >= 8) {
    searchStarted = true;
    status.textContent = "● SEARCHING FOR ENTITY";
  }
}

if (searchStarted) {
  updateDetection();
}
}

async function startCompass() {
  if (compassActive) return;

  if (!("DeviceOrientationEvent" in window)) {
    status.textContent = "● SENSOR NOT AVAILABLE";
    return;
  }

  // Intentar iniciar el audio directamente desde el botón.
  const audioPlayback = pkeAudio.play();

  audioPlayback.catch(error => {
    console.error("Error al reproducir el MP3:", error);
    status.textContent = "● AUDIO ERROR";
  });

  try {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      const permission = await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {
        pkeAudio.pause();
        pkeAudio.currentTime = 0;
        status.textContent = "● SENSOR PERMISSION DENIED";
        return;
      }
    }

    window.addEventListener("deviceorientationabsolute", onOrientation, true);
    window.addEventListener("deviceorientation", onOrientation, true);

    compassActive = true;
    pkeStatus.textContent = "READY";
    startButton.textContent = "DEACTIVATE PKE";

    // Activar el radar y comenzar el barrido desde cero.
    radarActive = true;
    sweepStartTime = null;
    radarElement.classList.add("scanning");
    requestAnimationFrame(animateRadar);

    status.textContent = "● CALIBRATING COMPASS";

  } catch (error) {
    pkeAudio.pause();
    status.textContent = "● SENSOR ERROR";
    console.error(error);
  }
}

function setTarget() {
  if (!compassActive) {
    status.textContent = "● ACTIVATE PKE FIRST";
    return;
  }

  if (currentHeading === null) {
    status.textContent = "● WAITING FOR COMPASS";
    return;
  }

  targetHeading = currentHeading;
  searchOriginHeading = currentHeading;
  searchStarted = false;

  targetMoving = false;
  targetWaitingForSweep = true;
  target.classList.remove("flash");

  targetDisplay.textContent = Math.round(targetHeading);

  // Mantener ocultos los efectos hasta comenzar a buscar.
  signalActive = false;
  wasDetected = false;

  clearInterval(vibrationTimer);
  vibrationTimer = null;

  if ("vibrate" in navigator) {
    navigator.vibrate(0);
  }

  document.querySelectorAll("#ledLeft span, #ledRight span").forEach(led => {
    led.classList.remove("active", "peak", "peak-on");
  });

  target.classList.remove("trace", "detected", "flash");

  pke.textContent = "000";
  signal.textContent = "READY";
  status.textContent = "● TARGET LOCKED - MOVE TO SCAN";
}

startButton.addEventListener("click", () => {
  if (compassActive) {
    deactivateCompass();
  } else {
    startCompass();
  }
});

targetButton.addEventListener("click", setTarget);

function deactivateCompass() {

  // Detener la brújula.
  compassActive = false;
  window.removeEventListener("deviceorientationabsolute", onOrientation, true);
  window.removeEventListener("deviceorientation", onOrientation, true);

  // Apagar el radar.
  radarActive = false;
  radarElement.classList.remove("scanning");

  // Detener el audio ambiental.
  pkeAudio.pause();
  pkeAudio.currentTime = 0;

  // Detener los sonidos de detección.
  stopDetectionSounds();

  // Detener detección y vibración.
  signalActive = false;
  searchStarted = false;
  targetHeading = null;
  searchOriginHeading = null;
  wasDetected = false;

  clearInterval(vibrationTimer);
  vibrationTimer = null;

  if ("vibrate" in navigator) {
    navigator.vibrate(0);
  }

  // Apagar todos los LED.
  document.querySelectorAll("#ledLeft span, #ledRight span").forEach(led => {
    led.classList.remove("active", "peak", "peak-on");
  });

  // Ocultar el punto del fantasma.
  target.classList.remove("trace", "detected", "flash");

  // Restablecer indicadores.
  pke.textContent = "000";
  signal.textContent = "SEARCHING";
  headingDisplay.textContent = "---";
  targetDisplay.textContent = "---";
  pkeStatus.textContent = "OFF";
  status.textContent = "● PKE DEACTIVATED";

  // Preparar el botón para volver a encender.
  startButton.textContent = "ACTIVATE PKE";

  // Reiniciar la búsqueda.
  targetWaitingForSweep = true;
  targetMoving = false;
  sweepStartTime = null;
}

const radarElement = document.querySelector(".radar");

function animateRadar(now) {

    if (!radarActive) return;

  if (sweepStartTime === null) {
    sweepStartTime = now;
  }

  // Una vuelta completa cada 2 segundos.
  sweepAngle = ((now - sweepStartTime) % 2000) / 2000 * 360;

  radarElement.style.setProperty(
    "--sweep-angle",
    `${sweepAngle}deg`
  );

  
  // El punto destella únicamente si la detección está activa
  // y el barrido pasa por su posición.
  const radarRect = radarElement.getBoundingClientRect();
const targetRect = target.getBoundingClientRect();

const radarCenterX = radarRect.left + radarRect.width / 2;
const radarCenterY = radarRect.top + radarRect.height / 2;

const targetCenterX = targetRect.left + targetRect.width / 2;
const targetCenterY = targetRect.top + targetRect.height / 2;

let pointAngle = Math.atan2(
  targetCenterX - radarCenterX,
  radarCenterY - targetCenterY
) * 180 / Math.PI;

pointAngle = (pointAngle + 360) % 360;

// La parte brillante del barrido está aproximadamente 5° detrás.
const visibleSweepAngle = (sweepAngle + 355) % 360;

const sweepDifference = angleDifference(
  visibleSweepAngle,
  pointAngle
);


 
 // Detectar el punto cuando el barrido lo alcanza.
if (
  signalActive &&
  targetWaitingForSweep &&
  !targetMoving &&
  sweepDifference <= 8
) {
  target.classList.add("flash");
  targetWaitingForSweep = false;
  targetMoveTime = now;
  targetMoving = true;
}

// Moverlo un poquito mientras todavía está visible.
if (targetMoving && now - targetMoveTime >= 180) {
  targetMoving = false;

  // Desplazamiento corto desde su posición actual.
  targetX = Math.max(15, Math.min(85,
    targetX + (Math.random() * 10 - 5)
  ));

  targetY = Math.max(12, Math.min(42,
    targetY + (Math.random() * 10 - 5)
  ));

  target.style.setProperty("--target-x", `${targetX}%`);
  target.style.setProperty("--target-y", `${targetY}%`);

  // Desaparecer poco después del movimiento.
  setTimeout(() => {
    target.classList.remove("flash");
  }, 120);
}

// Preparar la siguiente detección cuando la barra se aleje.
if (!targetMoving && sweepDifference > 20) {
  targetWaitingForSweep = true;
}
  requestAnimationFrame(animateRadar);
}

</script>
</body>
</html>
